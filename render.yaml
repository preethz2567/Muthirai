services:
  - type: web
    name: api
    env: docker
    plan: free
    rootDir: services/api
    envVars:
      - key: AGENT_WORKER_URL
        fromService:
          type: web
          name: agent-worker
          envVarKey: RENDER_INTERNAL_HOSTNAME

  - type: web
    name: agent-worker
    env: docker
    plan: free
    rootDir: services/agent-worker
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false

  - type: web
    name: frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: api
          envVarKey: RENDER_EXTERNAL_URL
