services:
  - type: web
    name: api
    env: docker
    rootDir: services/api
    envVars:
      - key: AGENT_WORKER_URL
        value: http://agent-worker:8001

  - type: web
    name: agent-worker
    env: docker
    rootDir: services/agent-worker
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false

  - type: web
    name: frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: api
          envVarKey: RENDER_EXTERNAL_URL
